<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>웹라트로 — 포커 덱빌딩 로그라이크</title>
<style>
/* ============================================================
   스타일 (Milestone 1, 6 — 카드 UI, 애니메이션, 반응형)
   ============================================================ */
:root {
  --bg: #1a3a2a;
  --bg-dark: #122b1f;
  --panel: #1f2937;
  --panel-light: #2d3b4e;
  --gold: #f5c542;
  --red: #e05252;
  --blue: #4a9eda;
  --text: #f0ead6;
  --card-w: 72px;
  --card-h: 104px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: radial-gradient(ellipse at center, var(--bg) 0%, var(--bg-dark) 100%);
  color: var(--text);
  font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
  overflow-x: hidden;
  user-select: none;
  -webkit-user-select: none;
}
button {
  font-family: inherit;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 700;
  transition: transform 0.1s, filter 0.1s;
}
button:hover:not(:disabled) { filter: brightness(1.15); transform: translateY(-2px); }
button:active:not(:disabled) { transform: translateY(0); }
button:disabled { opacity: 0.4; cursor: not-allowed; }

.screen { display: none; min-height: 100vh; }
.screen.active { display: flex; flex-direction: column; }

/* ---------- 시작 / 게임오버 화면 ---------- */
#startScreen, #gameoverScreen {
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 24px;
}
.title-big {
  font-size: clamp(48px, 10vw, 96px);
  color: var(--gold);
  text-shadow: 4px 4px 0 #00000088;
  letter-spacing: 4px;
}
.subtitle { font-size: 18px; opacity: 0.8; }
.btn-primary {
  background: var(--red);
  color: #fff;
  font-size: 22px;
  padding: 16px 48px;
  box-shadow: 0 4px 0 #a03030;
}
.btn-blue {
  background: var(--blue);
  color: #fff;
  font-size: 18px;
  padding: 12px 32px;
  box-shadow: 0 4px 0 #2e6e9e;
}
#gameoverStats {
  background: #00000044;
  padding: 20px 40px;
  border-radius: 12px;
  font-size: 20px;
  line-height: 1.8;
}

/* ---------- 게임 화면 레이아웃 ---------- */
#gameScreen { padding: 12px; gap: 10px; max-width: 980px; margin: 0 auto; width: 100%; }

#topBar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: stretch;
}
.info-box {
  background: var(--panel);
  border-radius: 10px;
  padding: 8px 14px;
  text-align: center;
  flex: 1;
  min-width: 90px;
}
.info-box .label { font-size: 11px; opacity: 0.65; text-transform: uppercase; letter-spacing: 1px; }
.info-box .value { font-size: 20px; font-weight: 700; }
.info-box .value.gold-text { color: var(--gold); }
.info-box .value.red-text { color: var(--red); }
.info-box .value.blue-text { color: var(--blue); }

#blindBox {
  background: var(--panel);
  border-radius: 10px;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex: 2.5;
  min-width: 220px;
}
#blindBadge {
  width: 52px; height: 52px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px;
  flex-shrink: 0;
  box-shadow: inset 0 -4px 0 #00000044;
}
.blind-small #blindBadge { background: #3b82c4; }
.blind-big   #blindBadge { background: #d4a017; }
.blind-boss  #blindBadge { background: #b03060; }
#blindInfo { flex: 1; }
#blindName { font-weight: 700; font-size: 15px; }
#blindDesc { font-size: 11px; color: #ff9e9e; min-height: 0; }
.card.debuffed { filter: grayscale(0.85); opacity: 0.55; }
#progressWrap {
  background: #00000066;
  height: 18px;
  border-radius: 9px;
  margin-top: 6px;
  overflow: hidden;
  position: relative;
}
#progressFill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--blue), var(--gold));
  border-radius: 9px;
  transition: width 0.5s ease;
}
#progressText {
  position: absolute;
  inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
  font-weight: 700;
  text-shadow: 1px 1px 2px #000;
}

/* ---------- 조커 영역 ---------- */
#jokerArea {
  background: #00000033;
  border-radius: 12px;
  padding: 8px 12px;
  min-height: 96px;
  display: flex;
  gap: 10px;
  align-items: center;
}
#jokerArea .area-label {
  writing-mode: vertical-rl;
  font-size: 11px;
  opacity: 0.5;
  letter-spacing: 2px;
}
.joker-card {
  width: 110px;
  min-height: 78px;
  background: linear-gradient(145deg, var(--j-c1, #5a3d8a), var(--j-c2, #3d2960));
  border: 2px solid var(--j-border, #8a6cc0);
  border-radius: 10px;
  padding: 7px 9px;
  font-size: 11px;
  position: relative;
  flex-shrink: 0;
  display: flex;
  gap: 7px;
  align-items: center;
}
.joker-card .j-icon {
  font-size: 26px;
  flex-shrink: 0;
  filter: drop-shadow(1px 2px 1px #00000066);
}
.joker-card .j-text { flex: 1; min-width: 0; }
.joker-card .j-name { font-weight: 700; color: var(--gold); font-size: 12px; margin-bottom: 3px; }
.joker-card .j-desc { opacity: 0.9; line-height: 1.35; }
.joker-card.pop { animation: jokerPop 0.35s ease; }
@keyframes jokerPop {
  0% { transform: scale(1); }
  40% { transform: scale(1.12) rotate(-2deg); }
  100% { transform: scale(1); }
}
.joker-slot-empty {
  width: 110px; min-height: 78px;
  border: 2px dashed #ffffff22;
  border-radius: 10px;
  flex-shrink: 0;
}

/* ---------- 플레이 영역 (낸 카드 + 점수) ---------- */
#playArea {
  min-height: 150px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  position: relative;
}
#playedCards { display: flex; gap: 8px; min-height: 110px; align-items: center; }
#handResult {
  font-size: 18px;
  font-weight: 700;
  min-height: 26px;
  display: flex;
  gap: 12px;
  align-items: baseline;
}
#handResult .chips { color: var(--blue); }
#handResult .mult { color: var(--red); }
#handResult .total { color: var(--gold); font-size: 24px; }

.score-popup {
  position: absolute;
  font-size: 40px;
  font-weight: 900;
  color: var(--gold);
  text-shadow: 3px 3px 0 #000;
  pointer-events: none;
  animation: scoreJump 1.1s ease-out forwards;
  z-index: 50;
}
@keyframes scoreJump {
  0%   { transform: translateY(0) scale(0.4); opacity: 0; }
  20%  { transform: translateY(-26px) scale(1.25); opacity: 1; }
  60%  { transform: translateY(-40px) scale(1); opacity: 1; }
  100% { transform: translateY(-72px) scale(0.95); opacity: 0; }
}

/* ---------- 카드 ---------- */
.card {
  width: var(--card-w);
  height: var(--card-h);
  background: #f7f3e8;
  border-radius: 8px;
  color: #222;
  position: relative;
  cursor: pointer;
  box-shadow: 0 3px 6px #00000066;
  transition: transform 0.18s ease, box-shadow 0.18s;
  flex-shrink: 0;
  transform-style: preserve-3d;
}
/* 4색 덱: 스페이드=검정, 하트=빨강, 다이아=파랑, 클럽=초록 */
.card.suit-spade   { color: #23262e; }
.card.suit-heart   { color: #c0392b; }
.card.suit-diamond { color: #1d6fb8; }
.card.suit-club    { color: #1e7d3c; }
/* 그림 카드 (J/Q/K) */
.card .face-frame {
  position: absolute;
  top: 22%; bottom: 22%; left: 18%; right: 18%;
  border: 2px solid currentColor;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px;
  background: linear-gradient(160deg, transparent 0%, currentColor 400%);
}
.card .face-frame::before,
.card .face-frame::after {
  content: attr(data-suit);
  position: absolute;
  font-size: 9px;
}
.card .face-frame::before { top: 1px; left: 3px; }
.card .face-frame::after  { bottom: 1px; right: 3px; transform: rotate(180deg); }
.card .corner {
  position: absolute;
  top: 5px; left: 7px;
  font-size: 16px;
  font-weight: 800;
  line-height: 1.05;
  text-align: center;
}
.card .corner.bottom {
  top: auto; left: auto;
  bottom: 5px; right: 7px;
  transform: rotate(180deg);
}
.card .pip {
  position: absolute;
  inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 30px;
}
.card.selected {
  transform: translateY(-22px);
  box-shadow: 0 10px 16px #000000aa, 0 0 0 3px var(--gold);
}
.card.dealt { animation: dealIn 0.4s ease backwards; }
@keyframes dealIn {
  from { transform: translateX(120px) rotateY(90deg); opacity: 0; }
  to   { transform: translateX(0) rotateY(0deg); opacity: 1; }
}
.card.played-anim { animation: playUp 0.35s ease backwards; cursor: default; }
@keyframes playUp {
  from { transform: translateY(60px) scale(0.8); opacity: 0; }
  to   { transform: translateY(0) scale(1); opacity: 1; }
}

#handArea {
  display: flex;
  justify-content: center;
  gap: 6px;
  padding: 24px 4px 8px;
  min-height: calc(var(--card-h) + 30px);
  flex-wrap: nowrap;
}

/* ---------- 하단 버튼 ---------- */
#actionBar {
  display: flex;
  justify-content: center;
  gap: 14px;
  padding-bottom: 8px;
}
#playBtn {
  background: var(--blue);
  color: #fff;
  font-size: 18px;
  padding: 14px 36px;
  box-shadow: 0 4px 0 #2e6e9e;
}
#discardBtn {
  background: var(--red);
  color: #fff;
  font-size: 18px;
  padding: 14px 36px;
  box-shadow: 0 4px 0 #a03030;
}
#sortBtn {
  background: var(--panel-light);
  color: var(--text);
  font-size: 14px;
  padding: 14px 18px;
}
#deckCount { font-size: 12px; opacity: 0.6; text-align: center; padding-bottom: 10px; }

/* ---------- 상점 ---------- */
#shopScreen { align-items: center; justify-content: center; gap: 20px; padding: 20px; }
#shopScreen h2 { color: var(--gold); font-size: 36px; text-shadow: 3px 3px 0 #00000066; }
#shopGold { font-size: 20px; }
#shopGold b { color: var(--gold); }
#shopItems { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
.shop-item {
  background: var(--panel);
  border-radius: 14px;
  padding: 14px;
  width: 180px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: center;
}
.shop-item .joker-card { width: 100%; }
.shop-item.sold-out { opacity: 0.35; }
.buy-btn {
  background: var(--gold);
  color: #222;
  padding: 8px 22px;
  font-size: 15px;
  width: 100%;
}
#ownedJokers {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
  background: #00000033;
  border-radius: 12px;
  padding: 12px;
  min-height: 100px;
  max-width: 700px;
}
.sell-btn {
  background: #777;
  color: #fff;
  font-size: 10px;
  padding: 3px 8px;
  margin-top: 5px;
}
.shop-note { font-size: 13px; opacity: 0.6; }

/* ---------- 라운드 클리어 배너 ---------- */
#clearBanner {
  position: fixed;
  inset: 0;
  background: #000000bb;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 14px;
  z-index: 100;
}
#clearBanner.show { display: flex; animation: fadeIn 0.3s; }
#clearBanner h2 { font-size: 48px; color: var(--gold); text-shadow: 4px 4px 0 #000; }
#clearBanner .reward { font-size: 22px; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ---------- 모바일 반응형 ---------- */
@media (max-width: 640px) {
  :root { --card-w: 44px; --card-h: 66px; }
  .card .corner { font-size: 11px; top: 3px; left: 4px; }
  .card .corner.bottom { bottom: 3px; right: 4px; }
  .card .pip { font-size: 18px; }
  .card .face-frame { font-size: 19px; }
  .card .face-frame::before, .card .face-frame::after { font-size: 6px; }
  .info-box .value { font-size: 15px; }
  .joker-card { width: 88px; font-size: 10px; min-height: 68px; flex-direction: column; gap: 2px; text-align: center; }
  .joker-card .j-icon { font-size: 18px; }
  .joker-slot-empty { width: 88px; min-height: 68px; }
  #playBtn, #discardBtn { font-size: 15px; padding: 12px 22px; }
  #handArea { gap: 3px; }
  .title-big { letter-spacing: 1px; }
}
</style>
</head>
<body>

<!-- ===================== 시작 화면 ===================== -->
<div id="startScreen" class="screen active">
  <div class="title-big">웹라트로</div>
  <div class="subtitle">포커 패 × 조커 × 덱빌딩 로그라이크</div>
  <button id="newGameBtn" class="btn-primary">새 게임</button>
  <div class="subtitle" style="font-size:13px; max-width:420px; line-height:1.7;">
    8장 중 최대 5장으로 포커 패를 만들어 점수를 모으세요.<br>
    조커를 사 모아 점점 높아지는 목표 점수를 버텨내세요!
  </div>
</div>

<!-- ===================== 게임 화면 ===================== -->
<div id="gameScreen" class="screen">
  <div id="topBar">
    <div id="blindBox" class="blind-small">
      <div id="blindBadge">🎯</div>
      <div id="blindInfo">
        <div id="blindName">스몰 블라인드</div>
        <div id="blindDesc"></div>
        <div id="progressWrap">
          <div id="progressFill"></div>
          <div id="progressText">0 / 300</div>
        </div>
      </div>
    </div>
    <div class="info-box"><div class="label">앤티</div><div class="value" id="anteVal">1</div></div>
    <div class="info-box"><div class="label">패 내기</div><div class="value blue-text" id="handsVal">4</div></div>
    <div class="info-box"><div class="label">버리기</div><div class="value red-text" id="discardsVal">3</div></div>
    <div class="info-box"><div class="label">골드</div><div class="value gold-text" id="goldVal">0</div></div>
  </div>

  <div id="jokerArea">
    <span class="area-label">조커</span>
    <!-- 조커 카드들이 렌더링됨 -->
  </div>

  <div id="playArea">
    <div id="playedCards"></div>
    <div id="handResult"></div>
  </div>

  <div id="handArea"></div>

  <div id="actionBar">
    <button id="playBtn">패 내기</button>
    <button id="sortBtn">정렬 ⇄</button>
    <button id="discardBtn">버리기</button>
  </div>
  <div id="deckCount">덱: 44장</div>
</div>

<!-- ===================== 상점 화면 ===================== -->
<div id="shopScreen" class="screen">
  <h2>🛒 상점</h2>
  <div id="shopGold">보유 골드: <b>0</b>G</div>
  <div id="shopItems"></div>
  <button id="rerollBtn" class="btn-blue" style="font-size:14px; padding:8px 22px;">🎲 새로고침 $5</button>
  <div class="shop-note">보유 조커 (최대 5개) — 판매하면 판매가를 돌려받습니다</div>
  <div id="ownedJokers"></div>
  <button id="nextRoundBtn" class="btn-blue">다음 라운드 ▶</button>
</div>

<!-- ===================== 승리 화면 ===================== -->
<div id="victoryScreen" class="screen" style="align-items:center; justify-content:center; text-align:center; gap:24px;">
  <div class="title-big" style="color:var(--gold)">🏆 승리!</div>
  <div id="victoryStats" style="background:#00000044; padding:20px 40px; border-radius:12px; font-size:20px; line-height:1.8;"></div>
  <button id="endlessBtn" class="btn-blue">무한 모드 계속 ▶</button>
  <button id="victoryNewBtn" class="btn-primary">새 게임</button>
</div>

<!-- ===================== 게임오버 화면 ===================== -->
<div id="gameoverScreen" class="screen">
  <div class="title-big" style="color:var(--red)">게임 오버</div>
  <div id="gameoverStats"></div>
  <button id="retryBtn" class="btn-primary">다시 도전</button>
</div>

<!-- ===================== 라운드 클리어 배너 ===================== -->
<div id="clearBanner">
  <h2>라운드 클리어!</h2>
  <div class="reward" id="clearReward"></div>
  <button id="toShopBtn" class="btn-blue">상점으로 ▶</button>
</div>

<script>
'use strict';

/* ============================================================
   constants — 카드 데이터, 패 점수표, 조커 목록 (Milestone 2, 4)
   ============================================================ */
// 4색 덱: 무늬마다 색이 다르다 (CSS의 .suit-* 클래스와 짝)
const SUITS = [
  { key: 'spade',   sym: '♠' },
  { key: 'heart',   sym: '♥' },
  { key: 'diamond', sym: '♦' },
  { key: 'club',    sym: '♣' },
];

// 그림 카드(J/Q/K) 중앙 일러스트
const FACE_ART = { J: '🤵', Q: '👸', K: '🤴' };
const RANKS = [
  { rank: '2',  value: 2,  chips: 2  },
  { rank: '3',  value: 3,  chips: 3  },
  { rank: '4',  value: 4,  chips: 4  },
  { rank: '5',  value: 5,  chips: 5  },
  { rank: '6',  value: 6,  chips: 6  },
  { rank: '7',  value: 7,  chips: 7  },
  { rank: '8',  value: 8,  chips: 8  },
  { rank: '9',  value: 9,  chips: 9  },
  { rank: '10', value: 10, chips: 10 },
  { rank: 'J',  value: 11, chips: 10 },
  { rank: 'Q',  value: 12, chips: 10 },
  { rank: 'K',  value: 13, chips: 10 },
  { rank: 'A',  value: 14, chips: 11 },
];

// 패 종류 (낮은 순) — rank 숫자가 클수록 강한 패
// upChips/upMult: 행성 카드로 레벨업할 때마다 증가하는 칩/배수 (발라트로 원작 수치)
// levelKey: 레벨을 공유하는 키 (로열 플러시는 스트레이트 플러시와 레벨 공유)
const HAND_TYPES = {
  HIGH_CARD:      { rank: 0, name: '하이카드',           base: 5,   mult: 1, upChips: 10, upMult: 1, levelKey: 'HIGH_CARD' },
  PAIR:           { rank: 1, name: '원 페어',            base: 10,  mult: 2, upChips: 15, upMult: 1, levelKey: 'PAIR' },
  TWO_PAIR:       { rank: 2, name: '투 페어',            base: 20,  mult: 2, upChips: 20, upMult: 1, levelKey: 'TWO_PAIR' },
  TRIPLE:         { rank: 3, name: '트리플',             base: 30,  mult: 3, upChips: 20, upMult: 2, levelKey: 'TRIPLE' },
  STRAIGHT:       { rank: 4, name: '스트레이트',         base: 30,  mult: 4, upChips: 30, upMult: 3, levelKey: 'STRAIGHT' },
  FLUSH:          { rank: 5, name: '플러시',             base: 35,  mult: 4, upChips: 15, upMult: 2, levelKey: 'FLUSH' },
  FULL_HOUSE:     { rank: 6, name: '풀하우스',           base: 40,  mult: 4, upChips: 25, upMult: 2, levelKey: 'FULL_HOUSE' },
  FOUR_KIND:      { rank: 7, name: '포카드',             base: 60,  mult: 7, upChips: 30, upMult: 3, levelKey: 'FOUR_KIND' },
  STRAIGHT_FLUSH: { rank: 8, name: '스트레이트 플러시',  base: 100, mult: 8, upChips: 40, upMult: 4, levelKey: 'STRAIGHT_FLUSH' },
  ROYAL_FLUSH:    { rank: 9, name: '로열 플러시',        base: 100, mult: 8, upChips: 40, upMult: 4, levelKey: 'STRAIGHT_FLUSH' },
};

// 족보 레벨 적용 수치
function handLevel(type) { return (state && state.handLevels[type.levelKey]) || 1; }
function handChipsOf(type) { return type.base + type.upChips * (handLevel(type) - 1); }
function handMultOf(type) { return type.mult + type.upMult * (handLevel(type) - 1); }

// 행성 카드 — 해당 족보의 레벨을 +1 (발라트로 원작 매핑)
const PLANETS = [

/* ---------- 조커 공통 헬퍼 ---------- */
function hasJoker(id) { return !!(state && state.jokers.some(j => j.id === id)); }
function isFaceCard(c) { return c.rank === 'J' || c.rank === 'Q' || c.rank === 'K' || hasJoker('pareidolia'); }
function chance(n) { // n분의 1 확률 ('이런! 모두 6이야' 보유 시 2배)
  if (hasJoker('oops')) n = Math.max(1, n / 2);
  return Math.random() < 1 / n;
}
function scoring(cards) { return cards.filter(c => !isDebuffed(c)); } // 디버프 카드는 조커 발동 제외
function randSuit() { return SUITS[Math.floor(Math.random() * 4)].key; }
function randRank() { return RANKS[Math.floor(Math.random() * RANKS.length)].rank; }
const SUIT_SYM = { spade: '♠', heart: '♥', diamond: '♦', club: '♣' };
const BASIC_HAND_KEYS = ['HIGH_CARD','PAIR','TWO_PAIR','TRIPLE','STRAIGHT','FLUSH','FULL_HOUSE','FOUR_KIND'];
function levelUpHand(levelKey, n = 1) {
  state.handLevels[levelKey] = (state.handLevels[levelKey] || 1) + n;
}
function jokerSum(field) { return state.jokers.reduce((s, j) => s + (j[field] || 0), 0); }
function destroyJoker(j) {
  const i = state.jokers.indexOf(j);
  if (i >= 0) state.jokers.splice(i, 1);
}
function makeJoker(def) {
  return Object.assign(Object.create(Object.getPrototypeOf(def)), def, {
    vars: JSON.parse(JSON.stringify(def.vars || {})),
    sellValue: Math.max(1, Math.ceil(def.cost / 2)),
  });
}

    onDiscard(cards) { this.vars.n += cards.length; while (this.vars.n >= 23) { this.vars.x += 1; this.vars.n -= 23; } },
    apply(ctx) { if (this.vars.x > 1) { ctx.mult *= this.vars.x; return `배수 ×${this.vars.x}`; } } },
];

// 앤티별 기본 점수 (발라트로 원작 수치, 앤티 8 클리어 = 승리, 이후 무한 모드)
const ANTE_BASE = [300, 800, 2000, 5000, 11000, 20000, 35000, 50000,
                   110000, 560000, 7200000, 300000000, 47000000000,
                   2.9e13, 7.7e16, 8.6e20];
const WIN_ANTE = 8;
function blindTarget(ante, blindIdx) {
  const base = ante <= ANTE_BASE.length
    ? ANTE_BASE[ante - 1]
    : ANTE_BASE[ANTE_BASE.length - 1] * Math.pow(10, ante - ANTE_BASE.length);
  let mult = [1, 1.5, 2][blindIdx];
  if (blindIdx === 2 && state && state.boss && state.boss.targetMult) mult *= state.boss.targetMult;
  return Math.round(base * mult);
}
const BLIND_NAMES = ['스몰 블라인드', '빅 블라인드', '보스 블라인드'];
const BLIND_CLASSES = ['blind-small', 'blind-big', 'blind-boss'];
const BLIND_ICONS = ['🎯', '🔶', '👹'];

function isDebuffed(card) {

/* ============================================================
   deck — 덱 생성, 셔플, 뽑기 (Milestone 1)
   ============================================================ */
function createDeck() {
  const deck = [];
  for (const s of SUITS) {
    for (const r of RANKS) {
      deck.push({ suit: s.key, sym: s.sym, rank: r.rank, value: r.value, chips: r.chips });
    }
  }
  return deck;
}

// Fisher-Yates 셔플
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function drawCards(n) {
  const drawn = state.deck.splice(0, Math.min(n, state.deck.length));
  state.hand.push(...drawn);
  return drawn;
}

/* ============================================================
   handEvaluator — 포커 패 판정 엔진 (Milestone 2)
   ============================================================ */
function evaluateHand(cards) {
  if (cards.length === 0) return null;

  const counts = {}; // value별 장수
  for (const c of cards) counts[c.value] = (counts[c.value] || 0) + 1;
  const countVals = Object.values(counts).sort((a, b) => b - a);

  // '네 손가락' 조커: 4장으로도 플러시/스트레이트 인정
  const minLen = hasJoker('four_fingers') ? 4 : 5;

  // 플러시 — '번진 조커': 같은 색(♥♦/♠♣)을 같은 무늬로 취급
  const suitKey = c => hasJoker('smeared')
    ? (c.suit === 'heart' || c.suit === 'diamond' ? 'red' : 'black')
    : c.suit;
  const suitCounts = {};
  for (const c of cards) suitCounts[suitKey(c)] = (suitCounts[suitKey(c)] || 0) + 1;
  const isFlush = cards.length >= minLen && Math.max(...Object.values(suitCounts)) >= minLen;

  // 스트레이트 — '지름길' 조커: 1칸 건너뛰기 허용 (A-2-3-4-5 백스트레이트 포함)
  const gap = hasJoker('shortcut') ? 2 : 1;
  let vals = [...new Set(cards.map(c => c.value))].sort((a, b) => a - b);
  if (vals.includes(14)) vals = [1, ...vals]; // A는 1로도 사용 가능
  let isStraight = false, straightHigh = 0, run = 1;
  for (let i = 1; i < vals.length; i++) {
    run = (vals[i] - vals[i - 1] <= gap) ? run + 1 : 1;
    if (run >= minLen) { isStraight = true; straightHigh = vals[i]; }
  }
  // 일반 판정: 낸 카드 전체가 스트레이트를 구성해야 함 (네 손가락이면 일부만으로도 가능)
  if (isStraight && minLen === 5 && (cards.length !== 5 || countVals[0] > 1)) isStraight = false;
  const isRoyal = isStraight && straightHigh === 14 && cards.every(c => c.value >= 10);

  let type;
  if (isStraight && isFlush) type = isRoyal ? HAND_TYPES.ROYAL_FLUSH : HAND_TYPES.STRAIGHT_FLUSH;
  else if (countVals[0] === 4) type = HAND_TYPES.FOUR_KIND;
  else if (countVals[0] === 3 && countVals[1] === 2) type = HAND_TYPES.FULL_HOUSE;
  else if (isFlush) type = HAND_TYPES.FLUSH;
  else if (isStraight) type = HAND_TYPES.STRAIGHT;
  else if (countVals[0] === 3) type = HAND_TYPES.TRIPLE;
  else if (countVals[0] === 2 && countVals[1] === 2) type = HAND_TYPES.TWO_PAIR;
  else if (countVals[0] === 2) type = HAND_TYPES.PAIR;
  else type = HAND_TYPES.HIGH_CARD;

  // "포함" 판정 — 조커 조건용 (예: 풀하우스는 페어와 트리플을 포함)
  return {
    type,
    hasPair: countVals[0] >= 2,
    hasTrips: countVals[0] >= 3,
    hasFour: countVals[0] >= 4,
    hasTwoPair: countVals.filter(v => v >= 2).length >= 2 || countVals[0] >= 4,
    hasStraight: isStraight,
    hasFlush: isFlush,
  };
}

/* ============================================================
   scoring — 점수 계산 + 조커 효과 적용 (Milestone 2, 4)
   ============================================================ */
function scoreHand(cards) {
  const hand = evaluateHand(cards);
  // 족보 레벨 반영 + 보스 '부싯돌'이면 절반
  let baseChips = handChipsOf(hand.type);
  let baseMult = handMultOf(hand.type);
  if (state.boss && state.boss.halve) {
    baseChips = Math.ceil(baseChips / 2);
    baseMult = Math.ceil(baseMult / 2);
  }
  // 디버프된 카드는 칩을 내지 않는다
  const cardChips = cards.reduce((sum, c) => sum + (isDebuffed(c) ? 0 : c.chips), 0);

  const ctx = {
    hand, cards, state,
    chips: baseChips + cardChips,
    mult: baseMult,
    cardChips,
  };

  // 조커를 슬롯 순서대로 적용 (재발동·복사 효과 위해 call로 this 바인딩)
  const triggered = [];
  state.jokers.forEach((joker, i) => {
    if (!joker.apply) return;
    const result = joker.apply.call(joker, ctx);
    if (result) triggered.push({ index: i, label: result });
  });

  return {
    hand,
    chips: Math.round(ctx.chips),
    mult: Math.round(ctx.mult * 100) / 100,
    total: Math.round(ctx.chips * ctx.mult),
    triggered,
  };
}

function newGame() {

function pickBoss() {
  if (state.bossPool.length === 0) state.bossPool = shuffle([...BOSS_BLINDS]);
  return state.bossPool.pop();
}

function effectiveHandSize() {
  return Math.max(1, HAND_SIZE + jokerSum('handSizeMod')
    - (state.boss && state.boss.handSizeDown ? state.boss.handSizeDown : 0));
}

function startRound() {
  state.boss = state.blindIdx === 2 ? pickBoss() : null;
  state.deck = shuffle(createDeck());
  state.hand = [];
  state.selected = new Set();
  state.roundScore = 0;
  state.handsLeft = state.boss && state.boss.oneHand
    ? 1 : Math.max(1, HANDS_PER_ROUND + jokerSum('handsMod'));
  state.discardsLeft = state.boss && state.boss.noDiscards
    ? 0 : Math.max(0, DISCARDS_PER_ROUND + jokerSum('discardsMod'));
  state.discardedCardsThisRound = 0;
  state.roundHandTypes = [];
  state.discardsUsedThisRound = 0;
  state.discardedJacksThisRound = 0;
  state.firstDiscardDone = false;
  state.busy = false;
  // 라운드 시작 훅 (도둑, 광기, 어중이떠중이, 무늬/랭크 변경 조커 등)
  state.jokers.slice().forEach(j => j.onRoundStart && j.onRoundStart());
  drawCards(effectiveHandSize());
  sortHand();
  el.playedCards.innerHTML = '';
  el.handResult.innerHTML = '';
  renderAll(true);
}

function currentTarget() {
  return blindTarget(state.ante, state.blindIdx);
}

/* ============================================================
   sound — Web Audio 비프음 (Milestone 6)
   ============================================================ */
let audioCtx = null;
function beep(freq, dur = 0.08, type = 'square', vol = 0.06, delay = 0) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur);
  } catch (e) { /* 오디오 미지원 환경 무시 */ }
}
const sfx = {
  select:  () => beep(520, 0.05, 'sine', 0.05),

  play:    () => { beep(440, 0.07); beep(660, 0.07, 'square', 0.06, 0.08); },
  score:   () => { beep(523, 0.09, 'triangle', 0.08); beep(659, 0.09, 'triangle', 0.08, 0.1); beep(784, 0.14, 'triangle', 0.08, 0.2); },
  discard: () => beep(220, 0.09, 'sawtooth', 0.04),
  buy:     () => { beep(880, 0.06, 'sine', 0.07); beep(1175, 0.1, 'sine', 0.07, 0.07); },
  clear:   () => { [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.13, 'triangle', 0.08, i * 0.11)); },
  gameover:() => { [392, 330, 262, 196].forEach((f, i) => beep(f, 0.18, 'sawtooth', 0.05, i * 0.16)); },

/* ============================================================
   게임 동작 (Milestone 1, 3)
   ============================================================ */
function toggleSelect(card) {
  if (state.busy) return;
  if (state.selected.has(card)) {
    state.selected.delete(card);
    sfx.deselect();
  } else {
    if (state.selected.size >= MAX_SELECT) return;
    state.selected.add(card);
    sfx.select();
  }
  renderHand();
  renderPreview();
  updateButtons();
}

let sortByRank = true;
function sortHand() {
  if (sortByRank) {
    state.hand.sort((a, b) => b.value - a.value || a.suit.localeCompare(b.suit));
  } else {
    state.hand.sort((a, b) => a.suit.localeCompare(b.suit) || b.value - a.value);
  }
}

function playHand() {
  if (state.busy || state.selected.size === 0 || state.handsLeft <= 0) return;
  state.busy = true;
  const played = [...state.selected];
  console.log('패 내기:', played.map(c => c.rank + c.sym).join(' ')); // Milestone 1 완료 기준
  state.hand = state.hand.filter(c => !state.selected.has(c));
  state.selected.clear();
  state.handsLeft--;
  sfx.play();

  // 낸 카드를 플레이 영역에 표시
  el.playedCards.innerHTML = '';
  played.forEach((c, i) => {
    const div = cardEl(c);
    div.classList.add('played-anim');
    if (isDebuffed(c)) div.classList.add('debuffed');
    div.style.animationDelay = i * 70 + 'ms';
    el.playedCards.appendChild(div);
  });

  renderHand();
  updateButtons();

  // 통계 갱신 (초신성: 현재 패 포함 / 카드 상어: 이전 패만)
  const ht = evaluateHand(played).type;
  state.handTypeCounts[ht.levelKey] = (state.handTypeCounts[ht.levelKey] || 0) + 1;

  // 점수 계산 (조커 포함)
  const result = scoreHand(played);
  state.roundHandTypes.push(ht.levelKey);
  // 패 낸 후 훅 (버스 탑승, 우주, 아이스크림, 탄산수 등)
  state.jokers.slice().forEach(j => j.afterPlay && j.afterPlay(result, played));

  setTimeout(() => {
    const lv = handLevel(result.hand.type);
    el.handResult.innerHTML =
      `<span>${result.hand.type.name}${lv > 1 ? ` <small style="color:var(--gold)">Lv.${lv}</small>` : ''}</span>` +
      `<span class="chips">${result.chips} 칩</span>` +
      `<span class="mult">× ${result.mult}</span>` +
      `<span class="total">= ${result.total.toLocaleString()}</span>`;

    // 발동한 조커 팝 애니메이션
    const jokerEls = el.jokerArea.querySelectorAll('.joker-card');
    result.triggered.forEach(t => {
      const je = jokerEls[t.index];
      if (je) je.classList.add('pop');
    });

    sfx.score();
    scorePopup('+' + result.total.toLocaleString());

    state.roundScore += result.total;
    if (state.roundScore > state.bestScore) state.bestScore = state.roundScore;
    renderTopBar();

    setTimeout(() => finishPlay(), 900);
  }, 450);
}

function finishPlay() {
  renderJokers(); // 성장형 조커 수치/파괴 반영
  const target = currentTarget();
  if (state.roundScore >= target) {
    roundClear();
    return;
  }
  if (state.handsLeft <= 0) {
    gameOver();
    return;
  }
  // 다음 패를 위해 카드 보충
  drawCards(effectiveHandSize() - state.hand.length);
  sortHand();
  state.busy = false;
  renderHand(true);
  updateButtons();
}

function discardCards() {
  if (state.busy || state.selected.size === 0 || state.discardsLeft <= 0) return;
  const discarded = [...state.selected];
  state.hand = state.hand.filter(c => !state.selected.has(c));
  state.selected.clear();
  state.discardsLeft--;
  state.discardedCardsThisRound += discarded.length;
  state.discardedJacksThisRound += discarded.filter(c => c.rank === 'J').length;
  // 버리기 훅 (우편 환급, 성, 라면, 그을린 조커, 트레이딩 카드 등)
  state.jokers.slice().forEach(j => j.onDiscard && j.onDiscard(discarded));
  state.firstDiscardDone = true;
  state.discardsUsedThisRound++;
  sfx.discard();
  drawCards(effectiveHandSize() - state.hand.length);
  sortHand();
  el.handResult.innerHTML = '';
  renderHand(true);
  renderTopBar();
  renderJokers();
  updateButtons();
}

/* ============================================================
   라운드 클리어 / 게임오버 (Milestone 3, 5)
   ============================================================ */
let pendingReward = 0;

function roundClear() {
  // 보스 격파 훅 (로켓, 모닥불)
  if (state.blindIdx === 2) state.jokers.slice().forEach(j => j.onBossDefeat && j.onBossDefeat());
  // 라운드 종료 훅 (황금 조커, 로켓, 위성, 팝콘, 그로 미셸 등)
  const notes = [];
  state.jokers.slice().forEach(j => { if (j.onRoundEnd) { const r = j.onRoundEnd(); if (r) notes.push(r); } });

  // 골드 보상: 블라인드 기본($3/$4/$5) + 남은 패 내기 ×$1 + 이자($5당 $1, 최대 $5, '달까지'면 2배)
  const base = BLIND_REWARDS[state.blindIdx];
  const handBonus = state.handsLeft;
  let interest = Math.min(5, Math.floor(Math.max(0, state.gold) / 5));
  if (hasJoker('to_the_moon')) interest += Math.min(5, Math.floor(Math.max(0, state.gold) / 5));
  pendingReward = base + handBonus + interest;
  const noteHTML = notes.length ? `<div style="font-size:15px; margin-top:6px;">${notes.join(' · ')}</div>` : '';

  // 앤티 8 보스 클리어 = 승리!
  if (state.blindIdx === 2 && state.ante === WIN_ANTE && !state.endless) {
    state.gold += pendingReward;
    pendingReward = 0;
    sfx.clear();
    el.victoryStats.innerHTML =
      `앤티 ${WIN_ANTE}의 보스 블라인드를 격파했습니다!<br>` +
      `최고 라운드 점수: <b style="color:var(--blue)">${state.bestScore.toLocaleString()}</b><br>` +
      `보유 골드: <b style="color:var(--gold)">${state.gold}G</b>`;
    showScreen('victoryScreen');
    return;
  }

  sfx.clear();
  el.clearReward.innerHTML =
    `보상: <b style="color:var(--gold)">${pendingReward}G</b>` +
    ` (블라인드 ${base}G + 남은 패 내기 ${handBonus}G + 이자 ${interest}G)` + noteHTML;
  el.clearBanner.classList.add('show');
}

function enterShop() {
  el.clearBanner.classList.remove('show');
  state.gold += pendingReward;
  pendingReward = 0;
  openShop();
}

function advanceBlind() {
  state.blindIdx++;
  if (state.blindIdx >= 3) {
    state.blindIdx = 0;
    state.ante++;
  }
  startRound();
  showScreen('gameScreen');
}

function gameOver() {
  // 미스터 본즈: 목표의 25% 이상이면 살아남는다 (자신 파괴, 라운드 클리어 처리)
  const bones = state.jokers.find(j => j.id === 'mr_bones');
  if (bones && state.roundScore >= currentTarget() * 0.25) {
    destroyJoker(bones);
    renderJokers();
    roundClear();
    return;
  }
  sfx.gameover();
  el.gameoverStats.innerHTML =
    `도달한 앤티: <b style="color:var(--gold)">${state.ante}</b><br>` +
    `블라인드: <b>${BLIND_NAMES[state.blindIdx]}</b><br>` +
    `이번 라운드 점수: <b>${state.roundScore.toLocaleString()}</b> / ${currentTarget().toLocaleString()}<br>` +
    `최고 라운드 점수: <b style="color:var(--blue)">${state.bestScore.toLocaleString()}</b>`;
  showScreen('gameoverScreen');
}

/* ============================================================
   상점 (Milestone 5)
   ============================================================ */
let shopStock = [];

function weightedRarity() {
  const r = Math.random() * 100;
  let acc = 0;
  for (const [k, w] of RARITY_WEIGHTS) { acc += w; if (r < acc) return k; }
  return 'common';
}

function randomShopJoker(excludeIds) {
  for (let tries = 0; tries < 50; tries++) {
    const rar = weightedRarity();
    const pool = JOKERS.filter(j => j.rarity === rar && !excludeIds.has(j.id));
    if (pool.length) return pool[Math.floor(Math.random() * pool.length)];
  }
  const pool = JOKERS.filter(j => !excludeIds.has(j.id));
  return pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
}

function stockShop() {
  const exclude = new Set(state.jokers.map(j => j.id));
  shopStock = [];
  for (let i = 0; i < 2; i++) {
    const j = randomShopJoker(exclude);
    if (j) { exclude.add(j.id); shopStock.push({ kind: 'joker', joker: j, sold: false }); }
  }
  shuffle([...PLANETS]).slice(0, 2).forEach(p => shopStock.push({ kind: 'planet', planet: p, sold: false }));
}

function canAfford(cost) {
  return state.gold - cost >= (hasJoker('credit_card') ? -20 : 0);
}

function planetPrice() { return hasJoker('astronomer') ? 0 : PLANET_COST; }

function rerollCostNow() {
  return (hasJoker('chaos') && !state.freeRerollUsed) ? 0 : state.rerollCost;
}

function rerollShop() {
  const cost = rerollCostNow();
  if (!canAfford(cost)) return;
  state.gold -= cost;
  if (cost === 0) state.freeRerollUsed = true;
  else state.rerollCost++;
  state.rerolls++; // 플래시 카드
  sfx.discard();
  stockShop();
  renderShop();
}

function openShop() {
  state.freeRerollUsed = false;
  state.rerollCost = 5;
  stockShop();
  renderShop();
  showScreen('shopScreen');
}

function planetCardEl(planet) {
  const type = HAND_TYPES[planet.key];
  const lv = handLevel(type);
  const div = document.createElement('div');
  div.className = 'joker-card';
  div.style.setProperty('--j-c1', '#1d3a6e');
  div.style.setProperty('--j-c2', '#0f1f3d');
  div.style.setProperty('--j-border', '#4a7ec0');
  div.innerHTML =
    `<div class="j-icon">${planet.icon}</div>` +
    `<div class="j-text"><div class="j-name">${planet.name}</div>` +
    `<div class="j-desc">${type.name} 레벨업 (Lv.${lv}→${lv + 1})<br>+${type.upChips}칩 / 배수 +${type.upMult}</div></div>`;
  return div;
}

function renderShop() {
  el.shopGold.innerHTML = `보유 골드: <b>${state.gold}</b>G`;

  el.shopItems.innerHTML = '';
  if (shopStock.length === 0) {
    el.shopItems.innerHTML = '<div class="shop-note">진열할 조커가 없습니다 (전부 보유 중!)</div>';
  }
  shopStock.forEach((item, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'shop-item' + (item.sold ? ' sold-out' : '');
    const cost = item.kind === 'joker' ? item.joker.cost : planetPrice();
    wrap.appendChild(item.kind === 'joker' ? jokerCardEl(item.joker) : planetCardEl(item.planet));
    const btn = document.createElement('button');
    btn.className = 'buy-btn';
    if (item.sold) {
      btn.textContent = item.kind === 'planet' ? '사용 완료' : '판매 완료';
      btn.disabled = true;
    } else {
      btn.textContent = cost === 0 ? '무료!' : `구매 ${cost}G`;
      btn.disabled = !canAfford(cost) ||
        (item.kind === 'joker' && state.jokers.length >= MAX_JOKERS);
      btn.addEventListener('click', () => buyItem(i));
    }
    wrap.appendChild(btn);
    el.shopItems.appendChild(wrap);
  });

  // 새로고침 버튼
  const rc = rerollCostNow();
  el.rerollBtn.textContent = rc === 0 ? '🎲 새로고침 (무료!)' : `🎲 새로고침 $${rc}`;
  el.rerollBtn.disabled = !canAfford(rc);

  // 보유 조커 + 판매 버튼
  el.ownedJokers.innerHTML = '';
  if (state.jokers.length === 0) {
    el.ownedJokers.innerHTML = '<div class="shop-note">아직 조커가 없습니다</div>';
  }
  state.jokers.forEach((j, i) => {
    const wrap = document.createElement('div');
    wrap.style.textAlign = 'center';
    wrap.appendChild(jokerCardEl(j));
    const sellBtn = document.createElement('button');
    sellBtn.className = 'sell-btn';
    const sellPrice = j.sellValue || Math.max(1, Math.floor(j.cost / 2));
    sellBtn.textContent = `판매 +${sellPrice}G`;
    sellBtn.addEventListener('click', () => sellJoker(i));
    wrap.appendChild(sellBtn);
    el.ownedJokers.appendChild(wrap);
  });
}

function buyItem(stockIdx) {
  const item = shopStock[stockIdx];
  if (item.sold) return;
  if (item.kind === 'joker') {
    if (!canAfford(item.joker.cost) || state.jokers.length >= MAX_JOKERS) return;
    state.gold -= item.joker.cost;
    state.jokers.push(makeJoker(item.joker)); // 인스턴스 생성 (성장 변수 독립)
  } else {
    const cost = planetPrice();
    if (!canAfford(cost)) return;
    state.gold -= cost;
    // 행성 카드는 구매 즉시 사용 — 해당 족보 레벨 +1 (영구)
    levelUpHand(HAND_TYPES[item.planet.key].levelKey);
    state.planetsUsed++;          // 별자리
    state.planetsUniq.add(item.planet.id); // 위성
  }
  item.sold = true;
  sfx.buy();
  renderShop();
}

function sellJoker(jokerIdx) {
  const j = state.jokers[jokerIdx];
  state.gold += j.sellValue || Math.max(1, Math.floor(j.cost / 2));
  state.jokers.splice(jokerIdx, 1);
  // 판매 훅 (모닥불)
  state.jokers.forEach(c => c.onSell && c.onSell());
  sfx.discard();
  renderShop();
}

/* ============================================================
   이벤트 바인딩
   ============================================================ */
el.newGameBtn.addEventListener('click', () => { beep(660, 0.08); newGame(); });
el.retryBtn.addEventListener('click', () => { beep(660, 0.08); newGame(); });
el.playBtn.addEventListener('click', playHand);
el.discardBtn.addEventListener('click', discardCards);
el.sortBtn.addEventListener('click', () => {
  sortByRank = !sortByRank;
  sortHand();
  renderHand();
});
el.toShopBtn.addEventListener('click', enterShop);
el.nextRoundBtn.addEventListener('click', advanceBlind);
el.rerollBtn.addEventListener('click', rerollShop);
el.endlessBtn.addEventListener('click', () => { state.endless = true; beep(660, 0.08); openShop(); });
el.victoryNewBtn.addEventListener('click', () => { beep(660, 0.08); newGame(); });
</script>
